name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: '也要跑完整 APK 編譯（autoninja chrome_public_apk，免費 runner 跑不完）'
        type: boolean
        default: false
      check_against_head:
        description: '不要釘在上游基準，改用最新 upstream HEAD 檢查補丁是否漂移'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2026-10-23 重寫。本輪之前的狀態：這個 job 從 2026-08 起就沒綠過，死在
# 「Configure GN build」——它的 --args 裡有一串 157/158 已不存在的 arg 名
# （enable_vr／enable_plugins／enable_nacl／enable_media_router／enable_feed／
# safe_browsing_mode…），而且完全沒套 `patches/`（跟本倉庫的補丁系列互不相認），
# 還在用 perl 大範圍擦 BUILD.gn 裡 `assert(enable_vr…)` 那種舊時代的做法。
#
# Push／PR 依 `patches/series` 的固定順序檢查完整補丁系列。手動勾
# `full_build` 時，同一個 job 會使用倉庫的 `args-android.gn` 產生 Android
# build graph 並編譯 APK；不再維護第二份 inline 參數。
#
# Android SDK／NDK 依賴很大，完整 APK 在免費 runner 上可能超過六小時，
# 所以 push／PR 只跑補丁適用性，完整建置仍由 workflow_dispatch 明確觸發。
jobs:
  android:
    name: Android 補丁適用性檢查
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,file_macro,pch_defines
      CCACHE_MAXSIZE: 15G
      CCACHE_COMPRESS: "1"
      CCACHE_NOHASHDIR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl lsb-release openjdk-17-jdk ccache

      - name: Download depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Create Chromium checkout
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks --no-history chromium
          # `target_os` 是 gclient 的依賴選擇，不是 args.gn：缺它時 checkout_android=false，
          # GN 會在 build/config/android/config.gni 直接拒絕，SDK/NDK 也不會同步下來。
          printf '\ntarget_os = ["android"]\n' >> .gclient

      - name: 釘到補丁的生成基準（patches/UPSTREAM_BASE）
        run: |
          cd "$CHROMIUM_DIR/src"
          BASE="$(cat "$GITHUB_WORKSPACE/patches/UPSTREAM_BASE" | tr -d '\r\n')"
          if [ "${{ github.event.inputs.check_against_head }}" = "true" ]; then
            echo "• 手動要求走 drift 檢查：用 upstream HEAD（`git rev-parse HEAD` = $(git rev-parse HEAD)）"
            echo "• 這一輪如果補丁套不下去，那是「上游漂移」而不是「補丁壞掉」——重新產生補丁即可"
          elif git fetch --depth=1 origin "$BASE" 2>/dev/null && git checkout --quiet FETCH_HEAD; then
            echo "• 已釘在 $BASE（patches/ 這一系列就是對它生成的）：$(cat chrome/VERSION | tr '\n' ' ')"
          else
            echo "::warning::抓不到釘選的 $BASE（伺服器不依 sha 取物？），改用 HEAD $(git rev-parse --short HEAD)；補丁若衝突請重新產生並更新 patches/UPSTREAM_BASE"
          fi
          echo "- upstream commit：`git rev-parse HEAD`" >> "$GITHUB_STEP_SUMMARY"
          echo "- chrome/VERSION：`tr '\n' ' ' < chrome/VERSION`" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync dependencies (shallow, parallel)
        run: |
          cd "$CHROMIUM_DIR/src"
          # 同 build-linux.yml：chromium.googlesource.com 對單 IP 限流，實測
          # mid-fetch 吐「RPC failed; HTTP 429」＋「expected flush after ref listing」。
          # gclient sync 可重入（已抓到的倉不重抓），所以退避重跑；第二次起降併發。
          for attempt in 1 2 3 4 5; do
            jobs=16; [ "$attempt" -gt 1 ] && jobs=6
            echo ">> gclient sync（第 $attempt 次嘗試，-j$jobs）"
            if gclient sync --shallow --no-history --nohooks -j"$jobs"; then
              echo ">> 同步完成"
              exit 0
            fi
            rc=$?
            if [ "$attempt" = 5 ]; then
              echo "::error::gclient sync 五輪都失敗（最後回傳 $rc）"
              exit "$rc"
            fi
            wait_s=$((attempt * 60))
            echo "::warning::第 $attempt 次同步失敗（rc=$rc），退避 ${wait_s}s 後重試"
            sleep "$wait_s"
          done

      - name: Run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient runhooks

      - name: Apply aetherium patch series
        run: |
          cd "$CHROMIUM_DIR/src"
          "$GITHUB_WORKSPACE/scripts/apply-patches.sh" | tee "$RUNNER_TEMP/apply.log"
          {
            echo '### 補丁套用結果（upstream HEAD 對patches/ 的相容性）'
            echo "- upstream HEAD：`git rev-parse HEAD`"
            echo "- chrome/VERSION：`cat chrome/VERSION | tr '\n' ' '`"
            echo "- 改動檔案數：`git status --porcelain | wc -l`"
            grep -E '^(總結|全部補丁)' "$RUNNER_TEMP/apply.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Android build dependencies
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          ./build/install-build-deps.sh --android --no-prompt

      - name: Configure GN build (Android)
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          mkdir -p out/Default
          cp "$GITHUB_WORKSPACE/args-android.gn" out/Default/args.gn
          gn gen out/Default
          python3 - out/Default <<'PY'
          import os, re, subprocess, sys
          out = sys.argv[1]
          listed = subprocess.run(
              ['gn', 'args', '--list', '--short', out], capture_output=True,
              text=True, check=True).stdout
          real = {line.split()[0] for line in listed.splitlines()
                  if line.strip() and not line.startswith(' ')}
          keys = [line.split('=')[0].strip()
                  for line in open(os.path.join(out, 'args.gn'), encoding='utf-8')
                  if re.match(r'^[A-Za-z_0-9]+ *=', line)]
          missing = [key for key in keys if key not in real]
          if missing:
              raise SystemExit(f'unknown Android GN args: {missing}')
          PY
          grep -q '<translationbundle lang="zh-TW">' chrome/app/resources/aetherium_strings_zh-TW.xtb
          ninja -C out/Default -t targets all | grep -q 'branded_strings_zh-TW.pak'

      - name: Build Android APK
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          autoninja -C out/Default chrome_public_apk

      - name: Show ccache stats
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: ccache -s -v

      - name: Cleanup ccache locks and temps
        if: always()
        run: |
          find ${{ github.workspace }}/.ccache -name "*.lock" -delete 2>/dev/null || true
          find ${{ github.workspace }}/.ccache -name "*.tmp*" -delete 2>/dev/null || true

      - name: Save ccache
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' && always() }}
        env:
          TAR_OPTIONS: "--warning=no-file-changed"
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload APK artifacts
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apk
          path: "$CHROMIUM_DIR/src/out/Default/apks/ChromePublic.apk"
          if-no-files-found: warn
