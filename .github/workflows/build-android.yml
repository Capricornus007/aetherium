name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      # --- ccache: explicit, stable paths so GN/ninja inherit them correctly ---
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime
      CCACHE_MAXSIZE: 10G
      CCACHE_COMPRESS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl openjdk-17-jdk ccache
      
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ github.ref_name }}-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ github.ref_name }}-${{ steps.date.outputs.date }}-
            ccache-android-${{ github.ref_name }}-
            ccache-android-

      - name: Prepare ccache
        run: |
          ccache --version
          ccache -M 10G
          ccache -z

      - name: Download depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Create Chromium checkout
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks --no-history android

      - name: Sync dependencies (shallow, parallel)
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient sync --shallow --no-history --nohooks -j16

      - name: Run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient runhooks

      - name: Patch GN files for disabled features
        run: |
          cd "$CHROMIUM_DIR/src"

          # 1. 使用 perl 跨行擦除所有涉及特性的 assert 區塊，解決語法阻攔
          find . -name "BUILD.gn" -exec perl -i -0777 -pe '
            s/assert\s*\(\s*enable_vr[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_pdf[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_print_preview[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_ar[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_supervised_users[\s\S]*?\)//g;
          ' {} +

          # 2. 補全 //chrome/browser/vr 下所有被缺失的 Dummy Targets
          mkdir -p chrome/browser/vr
          cat << 'EOF' > chrome/browser/vr/BUILD.gn
            group("vr") {}
            group("impl") {}
            group("vr_common") {}
            group("chrome_xr_integration_client") {}
            group("unit_tests") {}
          EOF

          # 3. 補全 //device/vr 下所有被缺失的 Dummy Targets
          mkdir -p device/vr
          cat << 'EOF' > device/vr/BUILD.gn
            group("vr") {}
            group("vr_base") {}
            group("vr_gl_bindings") {}
            group("vr_test_utils") {}
            group("openxr_data") {}
            group("openxr_test_helper") {}
            group("openxr_test_support_apk") {}
            group("openxr_test_support_apk__build_config_crbug_908819") {}
          EOF

          # 4. 補全 //chrome/browser/printing 下的 Dummy Target
          mkdir -p chrome/browser/printing
          if [ -f "chrome/browser/printing/BUILD.gn" ]; then
            echo 'group("test_support") {}' >> chrome/browser/printing/BUILD.gn
          else
            echo 'group("test_support") {}' > chrome/browser/printing/BUILD.gn
          fi

          # 5. 補全 //pdf 下的 Dummy Targets
          mkdir -p pdf
          if [ -f "pdf/BUILD.gn" ]; then
            echo 'group("strict") {}' >> pdf/BUILD.gn
            echo 'group("pdf_test_utils") {}' >> pdf/BUILD.gn
          else
            cat << 'EOF' > pdf/BUILD.gn
              group("strict") {}
              group("pdf_test_utils") {}
          EOF
          fi

          # 6. 補全 //components/safe_browsing 與 plugins 等子項 Missing Targets
          mkdir -p components/safe_browsing/content/common components/safe_browsing/content/browser chrome/browser/plugins chrome/browser/safe_browsing
          [ -f "components/safe_browsing/content/common/BUILD.gn" ] && echo 'group("file_type_policies") {}\ngroup("file_type_policies_test_support") {}' >> components/safe_browsing/content/common/BUILD.gn
          [ -f "components/safe_browsing/content/browser/BUILD.gn" ] && echo 'group("client_side_detection") {}' >> components/safe_browsing/content/browser/BUILD.gn
          [ -f "chrome/browser/plugins/BUILD.gn" ] && echo 'group("browser_tests") {}' >> chrome/browser/plugins/BUILD.gn
          [ -f "chrome/browser/safe_browsing/BUILD.gn" ] && echo 'group("blocking_page_platform_test_support") {}' >> chrome/browser/safe_browsing/BUILD.gn

      - name: Configure GN build
        run: |
          cd "$CHROMIUM_DIR/src"
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_official_build=false is_component_build=false is_debug=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 enable_nacl=false enable_nacl_nonsfi=false enable_remoting=false enable_resource_allowlist_generation=false enable_swiftshader=false enable_widevine=false enable_hangout_services_extension=false enable_mdns=false use_thin_lto=false is_java_debug=true treat_warnings_as_errors=false android_static_analysis="off" disable_fieldtrial_testing_config=true enable_iterator_debugging=false enable_cdm_host_verification=false enable_web_tests=false blink_enable_generated_code_formatting=false cc_wrapper="ccache" enable_pdf=false enable_print_preview=false enable_vr=false enable_media_router=false enable_spellcheck=false enable_plugins=false enable_webrtc=false rtc_include_tests=false enable_feed=false build_with_tflite_lib=false enable_reading_list=false safe_browsing_mode=0 optimize_webui=false'

      - name: Build Android APK
        run: |
          cd "$CHROMIUM_DIR/src"
          autoninja -C out/Default chrome_public_apk

      - name: Show ccache stats
        run: ccache -s

      - name: Cleanup ccache locks and temps
        if: always()
        run: |
          ccache -c 2>/dev/null || true
          find ~/.ccache -name "*.lock" -delete 2>/dev/null || true
          find ${{ github.workspace }}/.ccache -name "*.lock" -delete 2>/dev/null || true
          find ~/.ccache -name "*.tmp*" -delete 2>/dev/null || true
          find ${{ github.workspace }}/.ccache -name "*.tmp*" -delete 2>/dev/null || true

      - name: Save ccache
        if: always()
        env:
          TAR_OPTIONS: "--warning=no-file-changed"
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ github.ref_name }}-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "$CHROMIUM_DIR/src/out/Default/apks"
