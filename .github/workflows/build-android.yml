name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: '也要跑完整 APK 編譯（autoninja chrome_public_apk，免費 runner 跑不完）'
        type: boolean
        default: false
      check_against_head:
        description: '不要釘在上游基準，改用最新 upstream HEAD 檢查補丁是否漂移'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2026-10-23 重寫。本輪之前的狀態：這個 job 從 2026-08 起就沒綠過，死在
# 「Configure GN build」——它的 --args 裡有一串 157/158 已不存在的 arg 名
# （enable_vr／enable_plugins／enable_nacl／enable_media_router／enable_feed／
# safe_browsing_mode…），而且完全沒套 `patches/`（跟本倉庫的補丁系列互不相認），
# 還在用 perl 大範圍擦 BUILD.gn 裡 `assert(enable_vr…)` 那種舊時代的做法。
#
# 現在 push 只做一件一定有意義的事：抓最新 upstream → 確認 `patches/` 14 支
# 還套得乾淨（套不上就紅，並列出是哪一支、哪些沒套到）。Android 的 `gn gen`
# 需要 android SDK／NDK（install-build-deps --android 要抓幾 GB），加上完整
# APK 在 2 核 7GB 的免費 runner 上不可能在 6 小時上限內編完，所以那些一律
# 只在手動 workflow_dispatch 勾 full_build 時才跑。
#
# ⚠️ 注意：本倉庫的補丁系列是「Linux 桌面」取向（trim/ 與 config/args.gn 都是）。
#     Android 那條線目前只驗證「補丁能乾淨套上 upstream」，不保證 Android 的
#     gn gen／編譯可用；要真的做 Android 版，得另外出一份 Android 用的 args。
jobs:
  android:
    name: Android 補丁適用性檢查
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,file_macro,pch_defines
      CCACHE_MAXSIZE: 15G
      CCACHE_COMPRESS: "1"
      CCACHE_NOHASHDIR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl lsb-release openjdk-17-jdk ccache

      - name: Download depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Create Chromium checkout
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks --no-history chromium

      - name: 釘到補丁的生成基準（patches/UPSTREAM_BASE）
        run: |
          cd "$CHROMIUM_DIR/src"
          BASE="$(cat "$GITHUB_WORKSPACE/patches/UPSTREAM_BASE" | tr -d '\r\n')"
          if [ "${{ github.event.inputs.check_against_head }}" = "true" ]; then
            echo "• 手動要求走 drift 檢查：用 upstream HEAD（`git rev-parse HEAD` = $(git rev-parse HEAD)）"
            echo "• 這一輪如果補丁套不下去，那是「上游漂移」而不是「補丁壞掉」——重新產生補丁即可"
          elif git fetch --depth=1 origin "$BASE" 2>/dev/null && git checkout --quiet FETCH_HEAD; then
            echo "• 已釘在 $BASE（patches/ 這一系列就是對它生成的）：$(cat chrome/VERSION | tr '\n' ' ')"
          else
            echo "::warning::抓不到釘選的 $BASE（伺服器不依 sha 取物？），改用 HEAD $(git rev-parse --short HEAD)；補丁若衝突請重新產生並更新 patches/UPSTREAM_BASE"
          fi
          echo "- upstream commit：`git rev-parse HEAD`" >> "$GITHUB_STEP_SUMMARY"
          echo "- chrome/VERSION：`tr '\n' ' ' < chrome/VERSION`" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync dependencies (shallow, parallel)
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient sync --shallow --no-history --nohooks -j16

      - name: Run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient runhooks

      - name: Apply aetherium patch series
        run: |
          cd "$CHROMIUM_DIR/src"
          "$GITHUB_WORKSPACE/scripts/apply-patches.sh" | tee "$RUNNER_TEMP/apply.log"
          {
            echo '### 補丁套用結果（upstream HEAD 對patches/ 的相容性）'
            echo "- upstream HEAD：`git rev-parse HEAD`"
            echo "- chrome/VERSION：`cat chrome/VERSION | tr '\n' ' '`"
            echo "- 改動檔案數：`git status --porcelain | wc -l`"
            grep -E '^(總結|全部補丁)' "$RUNNER_TEMP/apply.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Android build dependencies
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          ./build/install-build-deps.sh --android --no-prompt

      - name: Configure GN build (Android)
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          # 只留 158 實際存在的 arg（`gn args --list` 核對）；舊清單裡的
          # enable_vr／enable_plugins／enable_nacl／enable_media_router／enable_feed／
          # enable_reading_list／build_with_tflite_lib／safe_browsing_mode=0 已移除或改名，
          # 留著只會讓 gn gen 報「Invalid configuration value」。
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_official_build=false is_component_build=false is_debug=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 enable_remoting=false enable_widevine=false enable_hangout_services_extension=false enable_mdns=false use_thin_lto=false is_java_debug=true treat_warnings_as_errors=false android_static_analysis="off" disable_fieldtrial_testing_config=true enable_cdm_host_verification=false enable_web_tests=false blink_enable_generated_code_formatting=false cc_wrapper="ccache" optimize_webui=false clang_use_chrome_plugins=false enable_pdf=false enable_print_preview=false enable_spellcheck=false enable_webrtc=false rtc_include_tests=false'

      - name: Build Android APK
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: |
          cd "$CHROMIUM_DIR/src"
          autoninja -C out/Default chrome_public_apk

      - name: Show ccache stats
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        run: ccache -s -v

      - name: Cleanup ccache locks and temps
        if: always()
        run: |
          find ${{ github.workspace }}/.ccache -name "*.lock" -delete 2>/dev/null || true
          find ${{ github.workspace }}/.ccache -name "*.tmp*" -delete 2>/dev/null || true

      - name: Save ccache
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' && always() }}
        env:
          TAR_OPTIONS: "--warning=no-file-changed"
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload APK artifacts
        if: ${{ github.event_name == 'workflow_dispatch'  && github.event.inputs.full_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "$CHROMIUM_DIR/src/out/Default/apks/ChromePublic.apk"
          if-no-files-found: warn
