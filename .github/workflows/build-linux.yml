name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      # --- ccache: explicit, stable paths so GN/ninja inherit them correctly ---
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime
      CCACHE_MAXSIZE: 10G
      CCACHE_COMPRESS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl lsb-release openjdk-17-jdk ccache

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-

      - name: Prepare ccache
        run: |
          ccache --version
          ccache -M 20G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z

      - name: Download depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Create Chromium checkout
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks --no-history chromium

      - name: Sync dependencies (shallow, parallel)
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient sync --shallow --no-history --nohooks -j16

      - name: Run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient runhooks

      - name: Patch GN files for disabled features
        run: |
          cd "$CHROMIUM_DIR/src"

          # 1. 使用 perl 跨行擦除所有涉及特性的 assert 區塊
          find . -name "BUILD.gn" -exec perl -i -0777 -pe '
            s/assert\s*\(\s*enable_vr[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_pdf[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_print_preview[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_ar[\s\S]*?\)//g;
            s/assert\s*\(\s*enable_supervised_users[\s\S]*?\)//g;
          ' {} +

          # 2. 補全 //chrome/browser/vr 下的 Dummy Targets
          mkdir -p chrome/browser/vr
          printf 'group("vr") {}\ngroup("impl") {}\ngroup("vr_common") {}\ngroup("chrome_xr_integration_client") {}\ngroup("unit_tests") {}\n' > chrome/browser/vr/BUILD.gn

          # 3. 補全 //device/vr 下的 Dummy Targets
          mkdir -p device/vr
          printf 'group("vr") {}\ngroup("vr_base") {}\ngroup("vr_gl_bindings") {}\ngroup("vr_test_utils") {}\ngroup("openxr_data") {}\ngroup("openxr_test_helper") {}\ngroup("openxr_test_support_apk") {}\ngroup("openxr_test_support_apk__build_config_crbug_908819") {}\n' > device/vr/BUILD.gn

          # 4. 補全 //chrome/browser/printing 下的 Dummy Target
          mkdir -p chrome/browser/printing
          if [ -f "chrome/browser/printing/BUILD.gn" ]; then
            printf 'group("test_support") {}\n' >> chrome/browser/printing/BUILD.gn
          else
            printf 'group("test_support") {}\n' > chrome/browser/printing/BUILD.gn
          fi

          # 5. 補全 //pdf 下的 Dummy Stubs (strict 是 config，pdf_test_utils 是 group)
          mkdir -p pdf
          if [ -f "pdf/BUILD.gn" ]; then
            printf 'config("strict") {}\ngroup("pdf_test_utils") {}\n' >> pdf/BUILD.gn
          else
            printf 'config("strict") {}\ngroup("pdf_test_utils") {}\n' > pdf/BUILD.gn
          fi

          # 6. 補全 Missing Targets
          mkdir -p components/safe_browsing/content/common components/safe_browsing/content/browser chrome/browser/plugins chrome/browser/safe_browsing
          
          if [ -f "components/safe_browsing/content/common/BUILD.gn" ]; then
            printf '\ngroup("file_type_policies") {}\ngroup("file_type_policies_test_support") {}\n' >> components/safe_browsing/content/common/BUILD.gn
          fi

          if [ -f "components/safe_browsing/content/browser/BUILD.gn" ]; then
            printf '\ngroup("client_side_detection") {}\n' >> components/safe_browsing/content/browser/BUILD.gn
          fi

          if [ -f "chrome/browser/plugins/BUILD.gn" ]; then
            printf '\ngroup("browser_tests") {}\n' >> chrome/browser/plugins/BUILD.gn
          fi

          if [ -f "chrome/browser/safe_browsing/BUILD.gn" ]; then
            printf '\ngroup("blocking_page_platform_test_support") {}\n' >> chrome/browser/safe_browsing/BUILD.gn
          fi

      - name: Install Chromium build dependencies
        run: |
          cd "$CHROMIUM_DIR/src"
          ./build/install-build-deps.sh --no-prompt

      - name: Configure GN build
        run: |
          cd "$CHROMIUM_DIR/src"
          gn gen out/Default --args='is_official_build=false is_debug=false is_component_build=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 enable_nacl=false enable_nacl_nonsfi=false enable_remoting=false enable_resource_allowlist_generation=false enable_swiftshader=false enable_widevine=false enable_hangout_services_extension=false enable_mdns=true use_thin_lto=false disable_fieldtrial_testing_config=true enable_iterator_debugging=false enable_cdm_host_verification=false enable_web_tests=false blink_enable_generated_code_formatting=false target_cpu="x64" cc_wrapper="ccache" enable_pdf=false enable_print_preview=false enable_vr=false enable_media_router=false enable_spellcheck=false enable_plugins=false enable_webrtc=false rtc_include_tests=false enable_feed=false build_with_tflite_lib=false enable_reading_list=false safe_browsing_mode=0 optimize_webui=false'

      - name: Build Chromium
        run: |
          cd "$CHROMIUM_DIR/src"
          autoninja -C out/Default chrome

      - name: Show ccache stats
        run: ccache -s

      - name: Cleanup ccache locks
        if: always()
        run: |
          find ${{ github.workspace }}/.ccache -name "*.lock" -delete 2>/dev/null || true
          find ${{ github.workspace }}/.ccache -name "*.tmp*" -delete 2>/dev/null || true

      - name: Save ccache
        if: always()
        env:
          TAR_OPTIONS: "--warning=no-file-changed"
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-chrome
          path: "$CHROMIUM_DIR/src/out/Default/chrome"
