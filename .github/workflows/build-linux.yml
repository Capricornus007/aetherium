name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_DIR: ${{ github.workspace }}/chromium
      # --- ccache: explicit, stable paths so GN/ninja inherit them correctly ---
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime
      CCACHE_MAXSIZE: 10G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl lsb-release openjdk-17-jdk ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Prepare ccache
        run: |
          ccache --version
          ccache -M 10G
          ccache -z

      - name: Download depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Create Chromium checkout
        run: |
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks --no-history chromium

      - name: Sync dependencies and run hooks
        run: |
          cd "$CHROMIUM_DIR/src"
          gclient sync --with_branch_heads --with_tags
          gclient runhooks

      - name: Install Chromium build dependencies
        run: |
          cd "$CHROMIUM_DIR/src"
          ./build/install-build-deps.sh --no-prompt

      - name: Configure GN build
        run: |
          cd "$CHROMIUM_DIR/src"
          gn gen out/Default --args='is_official_build=false is_debug=false is_component_build=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 enable_nacl=false enable_remoting=false target_cpu="x64" cc_wrapper="ccache"'

      - name: Build Chromium
        run: |
          cd "$CHROMIUM_DIR/src"
          autoninja -C out/Default chrome

      - name: Show ccache stats
        run: ccache -s

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-chrome
          path: "$CHROMIUM_DIR/src/out/Default/chrome"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
